[project]
name = "farm-animal-consulting-pipeline"
version = "0.1.0"
description = "농장동물 컨설팅 대시보드의 데이터 수집 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
