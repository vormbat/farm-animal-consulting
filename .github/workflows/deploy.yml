name: 사이트 배포

on:
  push:
    branches: [main]
    # 수집 워크플로가 data/ 에 커밋할 때마다 다시 빌드하지 않는다.
    # 화면은 런타임에 JSON 을 읽으므로 데이터가 바뀌어도 재배포가 필요 없다.
    paths-ignore:
      - 'data/**'
      - 'fixtures/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 사이트 주소 계산
        # 링크 미리보기(og:*)는 절대 주소여야 한다. 소유자 이름은 대소문자를
        # 가리지 않지만 github.io 호스트는 소문자라 낮춰서 쓴다.
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "VITE_SITE_URL=https://$owner.github.io/$REPO/" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
      - name: 빌드
        env:
          # 프로젝트 사이트는 /<repo>/ 하위에 올라간다. 저장소 이름을 직접 적지 않고
          # 컨텍스트에서 받아오므로 저장소를 옮기거나 이름을 바꿔도 손댈 곳이 없다.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DATA_REPO: ${{ github.repository }}
          VITE_DATA_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
