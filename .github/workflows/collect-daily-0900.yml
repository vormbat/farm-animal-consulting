# 이 파일은 `uv run python -m pipeline gen-workflows` 가 만든다. 직접 고치지 않는다.
# 주기를 바꾸려면 pipeline/core/schedule.py 를,
# 수집원을 추가하려면 pipeline/sources/ 에 파일을 만든다.

name: 수집 · 매일 아침

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

# 수집 워크플로끼리 같은 저장소에 동시에 push 하지 않도록 하나로 묶는다.
concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # 이 그룹에 속한 수집원:
      #   - egg_report: 주간 계란 수급 정보(다봄)
      #   - layer_price: 산란계 관련시세(다봄)
      #
      # --keep-going: 한 수집원이 실패해도 나머지를 마저 돌린다. 실패한
      # 수집원은 직전 커밋 값을 유지하고 stale 로 표시된다(파일을 비우지 않는다).
      - name: 수집 실행
        run: uv run python -m pipeline run egg_report layer_price --keep-going

      - name: 산출물 검증
        if: always()
        run: uv run python -m pipeline validate

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 매일 아침 수집 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # concurrency 로 대부분 막히지만, 수동 실행이 겹칠 수 있어 재시도를 남긴다.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push && exit 0
            echo "푸시 재시도 $attempt"
            sleep 5
          done
          exit 1
